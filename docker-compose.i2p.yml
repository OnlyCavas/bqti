
services:
  i2pd-1:
    user: "${UID}:${GID}"
    image: purplei2p/i2pd
    container_name: bqti-i2pd-1
    volumes:
      - ./docker/i2pd/i2pd.conf:/home/i2pd/conf/i2pd.conf:ro
      - i2pd-data-1:/home/i2pd/data
    ports:
      - "7070:7070"
      - "7656:7656"
      - "7655:7655/udp"
    network_mode: host
    restart: unless-stopped

volumes:
  i2pd-data-1:
